[project]
name = "tessel"
version = "0.1.0"
description = "Multi-tenant telemetry backend for soil sensors"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tessel"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
